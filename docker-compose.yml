version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: audit-log-mongo
    ports:
      - "27017:27017"
    volumes:
      - audit_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  audit_mongo_data: